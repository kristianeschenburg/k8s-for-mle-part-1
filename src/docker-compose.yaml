services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: part-1-backend:latest
    environment:
      DATA_FILE: ${DATA_FILE:-default_names.csv}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    image: part-1-frontend:latest
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8050:8050"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8050/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
