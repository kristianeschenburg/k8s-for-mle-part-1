apiVersion: v1
kind: Service
metadata:
  name: part-1-backend
spec:
  selector:
    app: part-1-backend
  ports:
  - port: 8000
    targetPort: 8000
    
---
apiVersion: v1
kind: Service
metadata:
  name: part-1-frontend
spec:
  type: NodePort
  selector:
    app: part-1-frontend
  ports:
  - port: 8050
    targetPort: 8050